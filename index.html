<!DOCTYPE html>
<html>
<head><title>My Profile</title></head>
<head>
    <style>
  :root {
    --bg-color: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.7);
    --accent: #38bdf8;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border: rgba(255, 255, 255, 0.1);
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #1e293b, var(--bg-color));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    line-height: 1.6;
    padding: 20px;
    box-sizing: border-box;
  }

  /* Container styling assuming standard elements */
  body > * {
    max-width: 600px;
    width: 100%;
  }

  /* Typography styling */
  h1, h2, h3 {
    color: var(--text-primary);
    font-weight: 700;
    letter-spacing: -0.025em;
    margin-top: 0;
    margin-bottom: 0.75rem;
  }

  h1 { font-size: 2.25rem; }
  h2 { font-size: 1.75rem; }

  p {
    color: var(--text-secondary);
    font-size: 1.1rem;
    margin-bottom: 1.25rem;
  }

  /* Code / Command highlights */
  code {
    background: rgba(56, 189, 248, 0.1);
    color: var(--accent);
    padding: 0.2em 0.5em;
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.9em;
    border: 1px solid rgba(56, 189, 248, 0.2);
  }
</style>
</head>
<body>
<h1>Hello, I am Shashank Injeti</h1>
<p>I am learning Git today.</p>
<p>My favourite Git command so far: git commit -m " message "</p>
</body>
</html>
